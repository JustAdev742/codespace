<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Ludora turns any lesson into a game. Host quizzes, races and team battles, collect Glims and play together." />
    <meta name="theme-color" content="#17133A" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F2F0FA" media="(prefers-color-scheme: light)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Ludora</title>
    <script>
      // Apply the saved theme before first paint so the page never flashes the wrong colours.
      try {
        var t = localStorage.getItem('ludora.theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
