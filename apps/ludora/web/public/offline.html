<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0A0F2C" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>You are offline | Ludora</title>
    <style>
      html { background: #0a0f2c; color: #fff; font-family: ui-sans-serif, system-ui, sans-serif; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px max(16px, env(safe-area-inset-right)) 24px max(16px, env(safe-area-inset-left)); box-sizing: border-box;
        background: radial-gradient(70% 55% at 50% -12%, rgb(84 128 255 / 0.5) 0%, rgb(58 107 255 / 0.14) 45%, transparent 72%), linear-gradient(180deg, #121c55 0%, #0b1236 55%, #070a20 100%); }
      main { max-width: 26rem; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 12px; }
      h1 { font-size: 2.25rem; line-height: 1.05; margin: 8px 0 0; }
      p { color: #d5dcfa; font-size: 1.125rem; line-height: 1.5; margin: 0; }
      a { margin-top: 12px; display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 24px; border-radius: 10px;
        background: #ffc233; color: #0b1020; font-weight: 700; font-size: 1.125rem; text-decoration: none; box-shadow: inset 0 -4px 0 rgb(0 0 0 / 0.24); }
      a:focus-visible { outline: 3px solid #ffc233; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" width="72" height="72" alt="" />
      <h1>You are offline</h1>
      <p>Ludora needs an internet connection to join or host a game. Check the Wi-Fi, then try again.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
