# Ludora OS loads the firewall through its own script, which fails closed: see /usr/libexec/ludora-os/firewall-up.
[Service]
ExecStart=
ExecStart=/usr/libexec/ludora-os/firewall-up
ExecReload=
ExecReload=/usr/libexec/ludora-os/firewall-up
# Stopping the service must not open the server (the stock unit empties every rule).
ExecStop=
# The stock unit may not write under /etc. Making missing rules again needs exactly these two folders.
ReadWritePaths=/etc/nftables /etc/ludora-os
