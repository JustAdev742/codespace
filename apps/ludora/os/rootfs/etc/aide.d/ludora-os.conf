# Files Ludora OS rewrites itself when settings change. `ludoractl doctor` watches them
# for tampering (it knows what they should contain), so the file-integrity check skips them.
!/etc/ludora-os
!/etc/nftables/ludora-os.nft
!/etc/containers/systemd
!/etc/ssh/sshd_config.d/00-ludora-os.conf
!/etc/ssh/authorized_keys.d
!/etc/sysctl.d/91-ludora-os-ipv6.conf
!/etc/dnf/automatic.conf
!/etc/usbguard/rules.conf
