# Ludora with Postgres. Put real values in a .env file next to this one
# (copy .env.example); nothing secret is committed here.
#   docker compose up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ludora
      POSTGRES_USER: ludora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ludora -d ludora"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://ludora:${POSTGRES_PASSWORD}@db:5432/ludora
      APP_ENV: ${APP_ENV:-production}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN in .env, e.g. https://play.example.org}
      IP_HASH_KEY: ${IP_HASH_KEY:?set IP_HASH_KEY in .env to a long random value}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Optional: AI question drafts. Empty leaves them off.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5-5}
      AI_DRAFTS_DAILY_LIMIT: ${AI_DRAFTS_DAILY_LIMIT:-500}
    ports:
      - "${PORT:-8787}:8787"
    volumes:
      - uploads:/data/uploads
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
