# Checks Ludora on every change to it: typecheck, lint, the full test suite
# against a real Postgres, the production build, end-to-end browser tests (of
# the app and of the playable demo), and the Docker image.

name: Ludora

on:
  push:
    branches: [main, "claude/**"]
    paths:
      - "apps/ludora/**"
      - ".github/workflows/ludora.yml"
  pull_request:
    paths:
      - "apps/ludora/**"
      - ".github/workflows/ludora.yml"
  workflow_dispatch:

concurrency:
  group: ludora-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Each server test file creates and drops its own database through this connection.
      TEST_DATABASE_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
    defaults:
      run:
        working-directory: apps/ludora
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/ludora/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: The chaos catalogue stays out of the public web app
        run: npx tsx scripts/check-public-bundle.ts

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # Reset at the start of every run; the reset refuses database names without "e2e".
      E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/ludora_e2e
    defaults:
      run:
        working-directory: apps/ludora
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/ludora/package-lock.json

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (production build, real server, Chromium)
        run: npm run test:e2e

      - name: Playable demo (static build under a sub-path, no server)
        run: npm run test:demo

      - name: Keep the report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/ludora/playwright-report
            apps/ludora/playwright-report-demo
            apps/ludora/test-results
          retention-days: 7

  browsers:
    # The end-to-end suite again in WebKit (Safari's engine, for iPads and Macs) and Firefox.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [webkit, firefox]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      E2E_DATABASE_URL: postgres://postgres:postgres@localhost:5432/ludora_e2e
      E2E_BROWSER: ${{ matrix.browser }}
    defaults:
      run:
        working-directory: apps/ludora
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/ludora/package-lock.json

      - run: npm ci

      - name: Install ${{ matrix.browser }}
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: End-to-end tests (production build, real server, ${{ matrix.browser }})
        run: npm run test:e2e

      - name: Keep the report and traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            apps/ludora/playwright-report
            apps/ludora/test-results
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t ludora:ci apps/ludora

      - name: Start it against Postgres and check it answers
        run: |
          docker network create ludora
          docker run -d --name db --network ludora -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=ludora postgres:16-alpine
          for i in $(seq 1 30); do docker exec db pg_isready -U postgres && break; sleep 1; done
          docker run -d --name app --network ludora -p 8787:8787 \
            -e DATABASE_URL=postgres://postgres:ci@db:5432/ludora \
            -e PUBLIC_ORIGIN=http://localhost:8787 \
            -e IP_HASH_KEY=ci-only-ip-hash-key-0123456789 \
            ludora:ci
          for i in $(seq 1 60); do curl -sf http://localhost:8787/api/health && break; sleep 1; done
          curl -sf http://localhost:8787/api/health
          curl -sf http://localhost:8787/ | grep -q '<div id="root">'
          curl -sf http://localhost:8787/api/modes > /dev/null

      - name: Container logs
        if: always()
        run: docker logs app || true
