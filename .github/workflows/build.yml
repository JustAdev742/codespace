# Builds Ghost Typer for Windows, macOS and Linux whenever the app changes.
# Results: the run's Artifacts. A v* tag also attaches them to a Release.

name: Build Ghost Typer

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
    paths:
      - "apps/ghost-typer/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: ghost-typer-windows
            path: "apps/ghost-typer/dist/Ghost Typer.exe"
          - os: macos-latest
            artifact: ghost-typer-macos
            path: "apps/ghost-typer/dist/Ghost Typer.app.zip"
          - os: ubuntu-latest
            artifact: ghost-typer-linux
            path: "apps/ghost-typer/dist/ghost-typer"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: apps/ghost-typer
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Linux build deps (GTK/WebKit for pywebview)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-gi gir1.2-webkit2-4.1 libgirepository1.0-dev libcairo2-dev

      - name: Engine self-test (source)
        run: python ghost_typer.py --selftest

      - name: Build
        run: python build.py

      - name: Smoke test the frozen app
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            ./dist/ghost-typer --selftest
          elif [ "$RUNNER_OS" = "Windows" ]; then
            test -s "dist/Ghost Typer.exe" && ls -la dist
          else
            test -d "dist/Ghost Typer.app" && ditto -c -k --keepParent "dist/Ghost Typer.app" "dist/Ghost Typer.app.zip" && ls -la dist
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - uses: softprops/action-gh-release@v2
        with:
          files: out/**/*
