<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KESTREL K1 Viewer</title>
<style>
  :root {
    --bg0: #f3f2ef; --bg1: #d8d9db; --ink: #16181b; --muted: #5b626b; --panel: rgba(255,255,255,0.82);
    --line: rgba(20,24,28,0.12); --accent: #e8892c;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg0: #24272b; --bg1: #0f1113; --ink: #eceef0; --muted: #9aa2ab; --panel: rgba(22,25,29,0.82); --line: rgba(255,255,255,0.12); }
  }
  :root[data-theme="dark"] { --bg0: #24272b; --bg1: #0f1113; --ink: #eceef0; --muted: #9aa2ab; --panel: rgba(22,25,29,0.82); --line: rgba(255,255,255,0.12); }
  html, body { margin: 0; height: 100%; background: var(--bg1); color: var(--ink);
    font: 14px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Inter, Roboto, sans-serif; overflow: hidden; }
  canvas { display: block; }
  #ui { position: absolute; left: 16px; top: 16px; width: min(300px, calc(100vw - 32px)); background: var(--panel); backdrop-filter: blur(10px);
    border: 1px solid var(--line); border-radius: 14px; padding: 14px 14px 10px; box-shadow: 0 8px 30px rgba(0,0,0,0.12); }
  #ui h1 { font-size: 15px; letter-spacing: 0.14em; margin: 0 0 2px; font-weight: 700; }
  #ui .sub { color: var(--muted); font-size: 12px; margin-bottom: 10px; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  button { font: inherit; font-size: 12px; padding: 6px 9px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--ink); cursor: pointer; }
  button:hover, button[aria-pressed="true"] { border-color: var(--accent); }
  button[aria-pressed="true"] { background: color-mix(in srgb, var(--accent) 16%, transparent); }
  label { font-size: 12px; color: var(--muted); display: block; margin-top: 6px; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  #status { position: absolute; right: 16px; bottom: 14px; font-size: 12px; color: var(--muted); }
  body.bare #ui, body.bare #status { display: none; }
  @media (max-width: 520px) { #ui { top: auto; bottom: 16px; } }
</style>
</head>
<body>
<div id="ui" role="region" aria-label="Viewer controls">
  <h1>KESTREL&nbsp;K1&nbsp;Mk&nbsp;II</h1>
  <div class="sub">Full-size humanoid · 1.81 m · 30 body DOF · 2 × 13-DOA hands · liquid-cooled legs</div>
  <div class="row" id="views"></div>
  <label for="explode">Exploded view</label>
  <input id="explode" type="range" min="0" max="1" step="0.01" value="0">
  <div class="row" id="modes"></div>
</div>
<div id="status">loading…</div>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { GTAOPass } from "three/addons/postprocessing/GTAOPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
import { HorizontalBlurShader } from "three/addons/shaders/HorizontalBlurShader.js";
import { VerticalBlurShader } from "three/addons/shaders/VerticalBlurShader.js";

const Q = new URLSearchParams(location.search);
if (Q.get("bare") === "1") document.body.classList.add("bare");
if (Q.get("theme")) document.documentElement.dataset.theme = Q.get("theme");
const MODEL = Q.get("model") || "kestrel_k1.glb";
const DARK = document.documentElement.dataset.theme === "dark" ||
  (!document.documentElement.dataset.theme && matchMedia("(prefers-color-scheme: dark)").matches);

// ------------------------------------------------------------------ renderer: studio look
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.NeutralToneMapping;      // keeps the warm white white (ACES greys it)
renderer.toneMappingExposure = parseFloat(Q.get("exposure") || "1.0");
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;       // soft key-light shadows (VSM bled outside its frustum)
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
// backdrop: vertical studio sweep (light warm grey, darker toward the floor), drawn as the scene background
function sweep() {
  const c = document.createElement("canvas"); c.width = 16; c.height = 512;
  const g = c.getContext("2d"), gr = g.createLinearGradient(0, 0, 0, 512);
  if (DARK) { gr.addColorStop(0, "#2b2e33"); gr.addColorStop(0.62, "#1d2024"); gr.addColorStop(1, "#141618"); }
  else { gr.addColorStop(0, "#f4f3f0"); gr.addColorStop(0.55, "#e6e5e2"); gr.addColorStop(1, "#cfd0d1"); }
  g.fillStyle = gr; g.fillRect(0, 0, 16, 512);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
scene.background = sweep();
const pmrem = new THREE.PMREMGenerator(renderer);
const envScene = new RoomEnvironment();
scene.environment = pmrem.fromScene(envScene, 0.03).texture;
scene.environmentIntensity = 0.85;

const camera = new THREE.PerspectiveCamera(28, innerWidth / innerHeight, 0.01, 50);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

// three-point studio lighting on top of the room environment (CAD frame: x fwd, y left, z up -> three (x, z, -y))
const key = new THREE.DirectionalLight(0xfff6ec, 2.1);
key.position.set(1.9, 5.2, 1.7);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -2.0, right: 2.0, top: 2.0, bottom: -2.0, near: 0.5, far: 14 });
key.target.position.set(0, 0.8, 0); scene.add(key.target);
key.shadow.bias = -0.0004; key.shadow.normalBias = 0.02;
scene.add(key);
const fill = new THREE.DirectionalLight(0xe9f0ff, 0.55);
fill.position.set(-3.0, 1.6, 2.8);
scene.add(fill);
const rim = new THREE.DirectionalLight(0xffffff, 1.25);
rim.position.set(-2.2, 3.2, -3.4);
scene.add(rim);
scene.add(new THREE.HemisphereLight(0xffffff, DARK ? 0x202326 : 0xb8b4ae, 0.25));

// soft floor: receives the blurred key shadow; contact shadow added after the model loads
const floor = new THREE.Mesh(new THREE.CircleGeometry(1.6, 96), new THREE.ShadowMaterial({ opacity: DARK ? 0.35 : 0.16 }));
floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; floor.renderOrder = 1;
scene.add(floor);

const root = new THREE.Group();
scene.add(root);
const cad2w = (v) => new THREE.Vector3(v[0], v[2], -v[1]);

// ------------------------------------------------------------------ CMF: two-tone satin white + graphite, one amber accent
const P = (o) => new THREE.MeshPhysicalMaterial(o), S = (o) => new THREE.MeshStandardMaterial(o);
const M = {
  shell: P({ color: 0xf0ede6, roughness: 0.42, metalness: 0.0, clearcoat: 0.35, clearcoatRoughness: 0.35, sheen: 0.25, sheenRoughness: 0.6, sheenColor: 0xffffff }),
  trim: P({ color: 0x2b2d31, roughness: 0.5, metalness: 0.05, clearcoat: 0.25, clearcoatRoughness: 0.45 }),
  joint: P({ color: 0x1c1d20, roughness: 0.38, metalness: 0.55, clearcoat: 0.2, clearcoatRoughness: 0.4 }),
  act: P({ color: 0x4a4e55, roughness: 0.32, metalness: 0.75, clearcoat: 0.15 }),
  alu: S({ color: 0xd2d5d9, roughness: 0.24, metalness: 1.0 }),
  frame: S({ color: 0xa9adb3, roughness: 0.34, metalness: 0.9 }),
  ti: S({ color: 0x8b8e93, roughness: 0.3, metalness: 0.9 }),
  cf: P({ color: 0x141516, roughness: 0.32, metalness: 0.2, clearcoat: 0.9 }),
  visor: P({ color: 0x07080a, roughness: 0.06, metalness: 0.25, clearcoat: 1.0, clearcoatRoughness: 0.03 }),
  accent: S({ color: 0xffb468, emissive: 0xff8a24, emissiveIntensity: 2.4, roughness: 0.35 }),
  sole: S({ color: 0x17181a, roughness: 0.9 }),
  boot: P({ color: 0x202124, roughness: 0.72, metalness: 0.0, sheen: 0.3, sheenRoughness: 0.8, sheenColor: 0x5a5d62 }),
  batt: S({ color: 0xd8842a, roughness: 0.5, metalness: 0.2 }),
  pcb: S({ color: 0x1d6b45, roughness: 0.55, metalness: 0.2 }),
  cam: P({ color: 0x0e0f11, roughness: 0.25, metalness: 0.3, clearcoat: 0.6 }),
  cool: P({ color: 0x263744, roughness: 0.45, metalness: 0.0, clearcoat: 0.4 }),
  copper: S({ color: 0xc87a45, roughness: 0.35, metalness: 0.9 }),
  steel: S({ color: 0x9ea3a8, roughness: 0.25, metalness: 1.0 }),
  magnet: S({ color: 0x7c8086, roughness: 0.3, metalness: 0.9 }),
};
const ghost = {};
for (const [k, m] of Object.entries(M)) { ghost[k] = m.clone(); ghost[k].transparent = true; ghost[k].opacity = 0.13; ghost[k].depthWrite = false; }

// explode vectors (metres, CAD frame z-up) per group
const EX = {
  head: [0, 0, 0.20], neck: [0, 0, 0.11], torso: [0, 0, 0], waist: [0, 0, -0.06], pelvis: [0, 0, -0.13],
  l_shoulder: [0, 0.13, 0.03], l_upper_arm: [0, 0.20, -0.02], l_forearm: [0, 0.26, -0.08], l_hand: [0, 0.31, -0.16],
  l_hip: [0, 0.06, -0.19], l_thigh: [0, 0.09, -0.28], l_shank: [0, 0.11, -0.40], l_foot: [0, 0.12, -0.52],
};
Object.assign(EX, { housing: [0, 0, 0], pcb: [0, 0, -0.05], enc: [0, 0, 0.02], stator: [0, 0, 0.0], rotor: [0, 0, 0.05], jacket: [0, 0, -0.02],
  stage1: [0, 0, 0.09], stage2: [0, 0, 0.13], wave: [0, 0, 0.09], cycloid: [0, 0, 0.09], bearing: [0, 0, 0.16], torque: [0, 0, 0.18], output: [0, 0, 0.20] });
for (const k of Object.keys(EX)) if (k.startsWith("l_")) { const v = EX[k]; EX["r_" + k.slice(2)] = [v[0], -v[1], v[2]]; }
function panelDir(name) {
  if (/_front$|chest_plate|abdomen_plate|shin_front|knee_cap$|visor$|abdomen_sensor_window/.test(name)) return [0.07, 0, 0];
  if (/_rear$|back_door|back_upper|radiator_pack|calf_rear|heel_counter/.test(name)) return [-0.07, 0, 0];
  if (/drive_cover|torso_side_L|deltoid/.test(name)) return [0, 0.05, 0];
  if (/torso_side_R/.test(name)) return [0, -0.05, 0];
  return [0, 0, 0];
}

const parts = [];
let unit = 1, contact = null;
const loader = new GLTFLoader();
const statusEl = document.getElementById("status");
loader.load(MODEL, (g) => {
  const box = new THREE.Box3().setFromObject(g.scene);
  const size = box.getSize(new THREE.Vector3());
  unit = Math.max(size.x, size.y, size.z) > 50 ? 0.001 : 1;
  g.scene.scale.setScalar(unit);
  root.add(g.scene);
  g.scene.updateMatrixWorld(true);
  const b2 = new THREE.Box3().setFromObject(g.scene);
  g.scene.position.y -= b2.min.y;          // soles on the ground plane
  g.scene.updateMatrixWorld(true);
  g.scene.traverse((o) => {
    if (!o.isMesh) return;
    let n = o.name || (o.parent && o.parent.name) || "";
    let p = o;
    while (p && !/__/.test(n)) { p = p.parent; n = p ? p.name || "" : ""; }
    const [group, rest] = n.split("__");
    const mat = (rest || "").split("_")[0];
    o.userData = { group, mat, name: rest || "", base: o.position.clone(), node: p || o };
    o.material = M[mat] || M.frame;
    o.castShadow = mat !== "accent"; o.receiveShadow = true;
    o.geometry.computeVertexNormals && o.geometry.attributes.normal === undefined && o.geometry.computeVertexNormals();
    parts.push(o);
  });
  const b3 = new THREE.Box3().setFromObject(root);
  contact = makeContactShadow(b3);
  applyMode(Q.get("mode") || "full");
  setExplode(parseFloat(Q.get("explode") || "0"));
  setView(Q.get("view") || "threequarter_front");
  statusEl.textContent = `${parts.length} parts · drag to orbit · scroll to zoom`;
  requestAnimationFrame(() => requestAnimationFrame(() => { window.__ready = true; }));
}, (e) => { statusEl.textContent = e.total ? `loading ${(100 * e.loaded / e.total).toFixed(0)} %` : "loading…"; },
   (err) => { statusEl.textContent = "failed to load model: " + err; window.__ready = true; });

// ------------------------------------------------------------------ contact shadow (depth from below, blurred twice)
function makeContactShadow(bb) {
  const w = Math.max(bb.max.x - bb.min.x, bb.max.z - bb.min.z) * 1.6 + 0.4;
  const RT = 512, rt = new THREE.WebGLRenderTarget(RT, RT), rtb = new THREE.WebGLRenderTarget(RT, RT);
  rt.texture.generateMipmaps = rtb.texture.generateMipmaps = false;
  const cx = (bb.min.x + bb.max.x) / 2, cz = (bb.min.z + bb.max.z) / 2;
  const plane = new THREE.Mesh(new THREE.PlaneGeometry(w, w).rotateX(Math.PI / 2),
    new THREE.MeshBasicMaterial({ map: rt.texture, transparent: true, opacity: DARK ? 0.8 : 0.62, depthWrite: false }));
  plane.scale.y = -1; plane.position.set(cx, 0.0015, cz); plane.renderOrder = 2;
  scene.add(plane);
  const cam = new THREE.OrthographicCamera(-w / 2, w / 2, w / 2, -w / 2, 0, 0.32);
  cam.rotation.x = Math.PI / 2; cam.position.set(cx, 0.0, cz);
  const depthMat = new THREE.MeshDepthMaterial();
  depthMat.userData.darkness = { value: 1.7 };
  depthMat.onBeforeCompile = (sh) => {
    sh.uniforms.darkness = depthMat.userData.darkness;
    sh.fragmentShader = "uniform float darkness;\n" + sh.fragmentShader.replace("gl_FragColor = vec4( vec3( 1.0 - fragCoordZ ), opacity );",
      "gl_FragColor = vec4( vec3( 0.0 ), ( 1.0 - fragCoordZ ) * darkness );");
  };
  depthMat.depthTest = false; depthMat.depthWrite = false;
  const hb = new THREE.ShaderMaterial(HorizontalBlurShader); hb.depthTest = false;
  const vb = new THREE.ShaderMaterial(VerticalBlurShader); vb.depthTest = false;
  const quad = new THREE.Mesh(new THREE.PlaneGeometry(), hb); quad.visible = false; scene.add(quad);
  function blur(amount) {
    quad.visible = true;
    quad.material = hb; hb.uniforms.tDiffuse.value = rt.texture; hb.uniforms.h.value = amount / 256;
    renderer.setRenderTarget(rtb); renderer.render(quad, cam);
    quad.material = vb; vb.uniforms.tDiffuse.value = rtb.texture; vb.uniforms.v.value = amount / 256;
    renderer.setRenderTarget(rt); renderer.render(quad, cam);
    quad.visible = false;
  }
  function update() {
    const bg = scene.background; scene.background = null;
    const hidden = [floor, plane]; hidden.forEach((h) => (h.visible = false));
    scene.overrideMaterial = depthMat;
    const cc = renderer.getClearAlpha(); renderer.setClearAlpha(0);
    renderer.setRenderTarget(rt); renderer.clear(); renderer.render(scene, cam);
    scene.overrideMaterial = null;
    blur(1.2); blur(0.5);
    renderer.setRenderTarget(null); renderer.setClearAlpha(cc);
    hidden.forEach((h) => (h.visible = true)); scene.background = bg;
  }
  return { update, plane };
}

const nodeBase = new Map();   // node -> world position at load
function setExplode(t) {
  document.getElementById("explode").value = t;
  const done = new Set();
  for (const o of parts) {
    const node = o.userData.node;
    if (done.has(node)) continue;
    done.add(node);
    if (!nodeBase.has(node)) { node.updateMatrixWorld(true); nodeBase.set(node, node.getWorldPosition(new THREE.Vector3())); }
    const v = EX[o.userData.group] || [0, 0, 0];
    const pd = panelDir(o.userData.name);
    const off = cad2w([v[0] + pd[0] * 1.4, v[1] + pd[1], v[2] + pd[2]]).multiplyScalar(t);
    const target = nodeBase.get(node).clone().add(off);
    node.parent.updateMatrixWorld(true);
    node.position.copy(node.parent.worldToLocal(target));
  }
  dirtyShadow = true;
}

let mode = "full", dirtyShadow = true;
const SKIN = ["shell", "trim", "visor", "accent", "sole", "boot"];
function applyMode(m) {
  mode = m;
  for (const o of parts) {
    const { mat, name } = o.userData;
    const isSkin = SKIN.includes(mat) || /_cover$|lidar_collar|lidar_window|lidar_cap|^ear_|_cap_cap$|_cap_bezel$|_cap_ring$|_cap_screw|_screw\d+$/.test(name);
    if (m === "full") { o.visible = true; o.material = M[mat] || M.frame; o.castShadow = mat !== "accent"; }
    else if (m === "skeleton") { o.visible = !isSkin; o.material = M[mat] || M.frame; o.castShadow = true; }
    else if (m === "ghost") { o.visible = true; o.material = isSkin ? (ghost[mat] || ghost.shell) : (M[mat] || M.frame); o.castShadow = !isSkin; }
  }
  document.querySelectorAll("#modes button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.mode === m)));
  dirtyShadow = true;
}

// camera presets: [azimuth deg (0 = front, +x), elevation deg, distance m, target z m, target y m, fov]
const VIEWS = {
  front: [0, 3, 4.8, 0.91, 0, 26], rear: [180, 3, 4.8, 0.91, 0, 26], left: [90, 3, 4.8, 0.91, 0, 26], right: [-90, 3, 4.8, 0.91, 0, 26],
  threequarter_front: [34, 8, 4.85, 0.91, 0, 26], threequarter_rear: [212, 10, 4.85, 0.91, 0, 26],
  head: [30, 5, 0.95, 1.69, 0, 26], hands: [62, 4, 0.72, 0.84, 0.20, 26], hip_knee: [24, 6, 1.75, 0.70, 0.11, 26],
  shoulder: [38, 10, 1.15, 1.43, 0.17, 26], foot: [48, 20, 1.05, 0.12, 0.10, 26], torso: [32, 8, 1.75, 1.33, 0, 26],
  exploded: [35, 8, 6.5, 0.89, 0, 28],
  actuator: [35, 22, 0.42, 0.065, 0, 30], actuator_exploded: [35, 18, 0.66, 0.12, 0, 30],
};
function setView(v) {
  const p = VIEWS[v] || VIEWS.threequarter_front;
  const [az, el, d, tz, ty, fov] = p;
  camera.fov = fov; camera.updateProjectionMatrix();
  const a = THREE.MathUtils.degToRad(az), e = THREE.MathUtils.degToRad(el);
  const tyW = tz, tzW = -ty;
  camera.position.set(d * Math.cos(e) * Math.cos(a), tyW + d * Math.sin(e), tzW - d * Math.cos(e) * Math.sin(a));
  controls.target.set(0, tyW, tzW);
  controls.update();
  document.querySelectorAll("#views button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.view === v)));
}

const vbar = document.getElementById("views");
for (const v of ["front", "rear", "left", "right", "threequarter_front", "threequarter_rear", "head", "hands", "hip_knee", "foot"]) {
  const b = document.createElement("button"); b.textContent = v.replace("threequarter_", "¾ ").replace("_", " "); b.dataset.view = v;
  b.onclick = () => setView(v); vbar.appendChild(b);
}
const mbar = document.getElementById("modes");
for (const m of ["full", "ghost", "skeleton"]) {
  const b = document.createElement("button"); b.textContent = m; b.dataset.mode = m; b.onclick = () => applyMode(m); mbar.appendChild(b);
}
document.getElementById("explode").addEventListener("input", (e) => setExplode(parseFloat(e.target.value)));

// ------------------------------------------------------------------ post: faint bloom on the light guides (GTAO available with ?ao=1)
const composer = new EffectComposer(renderer, new THREE.WebGLRenderTarget(1, 1, { type: THREE.HalfFloatType, samples: 4 }));
composer.setPixelRatio(renderer.getPixelRatio());
composer.setSize(innerWidth, innerHeight);
composer.addPass(new RenderPass(scene, camera));
const gtao = new GTAOPass(scene, camera, innerWidth, innerHeight);
gtao.output = GTAOPass.OUTPUT.Default;
gtao.blendIntensity = 0.85;
gtao.updateGtaoMaterial({ radius: 0.06, distanceExponent: 1.4, thickness: 1.2, scale: 1.0, samples: 16 });
gtao.updatePdMaterial({ lumaPhi: 10, depthPhi: 2, normalPhi: 3, radius: 6, rings: 2, samples: 16 });
if (Q.get("ao") === "1") composer.addPass(gtao);     // opt-in: GTAO darkens the floor behind the model in some rear views
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.28, 0.35, 0.92);
composer.addPass(bloom);
composer.addPass(new OutputPass());

function frame() {
  controls.update();
  if (contact && dirtyShadow) { contact.update(); dirtyShadow = false; }
  composer.render();
}
addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight); gtao.setSize(innerWidth, innerHeight);
});
camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
(function loop() { frame(); if (!window.__pause) requestAnimationFrame(loop); })();
window.__renderOnce = () => { dirtyShadow = true; frame(); };
window.__setView = setView; window.__setExplode = setExplode; window.__applyMode = applyMode;
</script>
</body>
</html>
