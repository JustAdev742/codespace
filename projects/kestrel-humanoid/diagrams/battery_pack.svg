rray='4 3'/><circle cx='816.0' cy='120.0' r='22' fill='#fff7ef' stroke='#d9822b' stroke-width='1.5'/><circle cx='816.0' cy='172.0' r='22' fill='#fff7ef' stroke='#d9822b' stroke-width='1.5'/><circle cx='816.0' cy='224.0' r='22' fill='#fff7ef' stroke='#d9822b' stroke-width='1.5'/><circle cx='816.0' cy='276.0' r='22' fill='#fff7ef' stroke='#d9822b' stroke-width='1.5'/><circle cx='816.0' cy='328.0' r='22' fill='#fff7ef' stroke='#d9822b' stroke-width='1.5'/><circle cx='816.0' cy='380.0' r='22' fill='#fff7ef' stroke='#d9822b' stroke-width='1.5'/><text x='816.0' y='432.0' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='12' fill='#1f2328' text-anchor='middle' font-weight='600'>S12</text><rect x='794' y='94' width='44' height='312' rx='6' fill='none' stroke='#2f6fdf' stroke-width='1.5' stroke-dasharray='4 3'/><circle cx='878.0' cy='120.0' r='22' fill='#fff7ef' stroke='#d9822b' stroke-width='1.5'/><circle cx='878.0' cy='172.0' r='22' fill='#fff7ef' stroke='#d9822b' stroke-width='1.5'/><circle cx='878.0' cy='224.0' r='22' fill='#fff7ef' stroke='#d9822b' stroke-width='1.5'/><circle cx='878.0' cy='276.0' r='22' fill='#fff7ef' stroke='#d9822b' stroke-width='1.5'/><circle cx='878.0' cy='328.0' r='22' fill='#fff7ef' stroke='#d9822b' stroke-width='1.5'/><circle cx='878.0' cy='380.0' r='22' fill='#fff7ef' stroke='#d9822b' stroke-width='1.5'/><text x='878.0' y='432.0' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='12' fill='#1f2328' text-anchor='middle' font-weight='600'>S13</text><rect x='856' y='94' width='44' height='312' rx='6' fill='none' stroke='#2f6fdf' stroke-width='1.5' stroke-dasharray='4 3'/><circle cx='940.0' cy='120.0' r='22' fill='#fff7ef' stroke='#d9822b' stroke-width='1.5'/><circle cx='940.0' cy='172.0' r='22' fill='#fff7ef' stroke='#d9822b' stroke-width='1.5'/><circle cx='940.0' cy='224.0' r='22' fill='#fff7ef' stroke='#d9822b' stroke-width='1.5'/><circle cx='940.0' cy='276.0' r='22' fill='#fff7ef' stroke='#d9822b' stroke-width='1.5'/><circle cx='940.0' cy='328.0' r='22' fill='#fff7ef' stroke='#d9822b' stroke-width='1.5'/><circle cx='940.0' cy='380.0' r='22' fill='#fff7ef' stroke='#d9822b' stroke-width='1.5'/><text x='940.0' y='432.0' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='12' fill='#1f2328' text-anchor='middle' font-weight='600'>S14</text><rect x='918' y='94' width='44' height='312' rx='6' fill='none' stroke='#2f6fdf' stroke-width='1.5' stroke-dasharray='4 3'/><circle cx='1002.0' cy='120.0' r='22' fill='#fff7ef' stroke='#d9822b' stroke-width='1.5'/><circle cx='1002.0' cy='172.0' r='22' fill='#fff7ef' stroke='#d9822b' stroke-width='1.5'/><circle cx='1002.0' cy='224.0' r='22' fill='#fff7ef' stroke='#d9822b' stroke-width='1.5'/><circle cx='1002.0' cy='276.0' r='22' fill='#fff7ef' stroke='#d9822b' stroke-width='1.5'/><circle cx='1002.0' cy='328.0' r='22' fill='#fff7ef' stroke='#d9822b' stroke-width='1.5'/><circle cx='1002.0' cy='380.0' r='22' fill='#fff7ef' stroke='#d9822b' stroke-width='1.5'/><text x='1002.0' y='432.0' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='12' fill='#1f2328' text-anchor='middle' font-weight='600'>S15</text><rect x='980' y='94' width='44' height='312' rx='6' fill='none' stroke='#2f6fdf' stroke-width='1.5' stroke-dasharray='4 3'/><circle cx='1064.0' cy='120.0' r='22' fill='#fff7ef' stroke='#d9822b' stroke-width='1.5'/><circle cx='1064.0' cy='172.0' r='22' fill='#fff7ef' stroke='#d9822b' stroke-width='1.5'/><circle cx='1064.0' cy='224.0' r='22' fill='#fff7ef' stroke='#d9822b' stroke-width='1.5'/><circle cx='1064.0' cy='276.0' r='22' fill='#fff7ef' stroke='#d9822b' stroke-width='1.5'/><circle cx='1064.0' cy='328.0' r='22' fill='#fff7ef' stroke='#d9822b' stroke-width='1.5'/><circle cx='1064.0' cy='380.0' r='22' fill='#fff7ef' stroke='#d9822b' stroke-width='1.5'/><text x='1064.0' y='432.0' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='12' fill='#1f2328' text-anchor='middle' font-weight='600'>S16</text><rect x='1042' y='94' width='44' height='312' rx='6' fill='none' stroke='#2f6fdf' stroke-width='1.5' stroke-dasharray='4 3'/><text x='40.0' y='470.0' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='12' fill='#59636e' text-anchor='start' font-weight='400'>Each dashed column = one parallel group (6P, 30 Ah); series links alternate top/bottom; the 16S path snakes S1→S8 in layer 1, rises, and returns S9→S16 in layer 2.</text><text x='40.0' y='510.0' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='12' fill='#1f2328' text-anchor='start' font-weight='400'>• Cells: Molicel P50B — 5.0 Ah (4.85 min), 60 A cont, DCIR 12.8 mΩ, ≤71 g. 96 cells = 6.8 kg; pack ≈ 8.9 kg incl. enclosure.</text><text x='40.0' y='534.0' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='12' fill='#59636e' text-anchor='start' font-weight='400'>• Interconnect: 0.15 mm Ni-plated copper/nickel sandwich strip, resistance-welded; ≤ 10 A per cell normal, 60 A cell rating (≥5× margin at 2.8 kW).</text><text x='40.0' y='558.0' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='12' fill='#59636e' text-anchor='start' font-weight='400'>• Cell fusing: 0.3 mm Al bond wire or 22 AWG fuse link per cell to the collector (isolates an internally shorted cell).</text><text x='40.0' y='582.0' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='12' fill='#59636e' text-anchor='start' font-weight='400'>• Thermal-runaway mitigation: 1 mm mica between layers and around groups; vent path to rear grille; NTC on 8 cells + busbars; Al enclosure, PC/ABS inner holders.</text><text x='40.0' y='606.0' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='12' fill='#59636e' text-anchor='start' font-weight='400'>• BMS: Orion BMS 2 (16 taps + 8 thermistors, CAN). Secondary protection: TI BQ77216 OVP on separate taps → SSD fault input.</text><text x='40.0' y='630.0' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='12' fill='#59636e' text-anchor='start' font-weight='400'>• Disconnect: TPS48111 back-to-back MOSFET SSD with precharge + 125 A fuse; manual service disconnect accessible through the back door.</text><text x='40.0' y='654.0' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='12' fill='#59636e' text-anchor='start' font-weight='400'>• Build &amp; test: incoming-inspect every cell (mass, OCV, 1 kHz IR) and match groups within 0.5 % capacity; hi-pot 500 V pack-to-enclosure; IR scan at 1C.</text></svg>
