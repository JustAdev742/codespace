' text-anchor='start' font-weight='400'>LLM task planner, VLA policy (GR00T / π0 class), skill API with safety envelope</text><rect x='870' y='144' width='140' height='62' rx='8' fill='#f6f8fa' stroke='#7a4fc9' stroke-width='1.5'/><text x='940.0' y='175.0' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' fill='#1f2328' text-anchor='middle' font-weight='600'>0.5–10 Hz</text><rect x='1030' y='144' width='180' height='62' rx='8' fill='#f6f8fa' stroke='#7a4fc9' stroke-width='1.5'/><text x='1120.0' y='175.0' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' fill='#1f2328' text-anchor='middle' font-weight='600'>Thor GPU</text><rect x='30' y='218' width='820' height='62' rx='8' fill='#fff' stroke='#2f6fdf' stroke-width='1.5'/><text x='46.0' y='243.0' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='15' fill='#1f2328' text-anchor='start' font-weight='700'>8 Navigation</text><text x='46.0' y='264.0' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='12' fill='#59636e' text-anchor='start' font-weight='400'>Nav2 (footstep-aware), nvblox map, behaviour trees</text><rect x='870' y='218' width='140' height='62' rx='8' fill='#f6f8fa' stroke='#2f6fdf' stroke-width='1.5'/><text x='940.0' y='249.0' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' fill='#1f2328' text-anchor='middle' font-weight='600'>5–20 Hz</text><rect x='1030' y='218' width='180' height='62' rx='8' fill='#f6f8fa' stroke='#2f6fdf' stroke-width='1.5'/><text x='1120.0' y='249.0' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' fill='#1f2328' text-anchor='middle' font-weight='600'>Thor</text><rect x='30' y='292' width='820' height='62' rx='8' fill='#fff' stroke='#2f6fdf' stroke-width='1.5'/><text x='46.0' y='317.0' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='15' fill='#1f2328' text-anchor='start' font-weight='700'>7 Perception</text><text x='46.0' y='