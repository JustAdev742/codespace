or='middle' font-weight='400'>encoders 5 V via drive carriers</text><text x='1030.0' y='453.0' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='10.5' fill='#59636e' text-anchor='middle' font-weight='400'>safety MCU has own buck + supercap</text><line x1='435.0' y1='400.0' x2='435.0' y2='340.0' stroke='#2f8f5b' stroke-width='1.5' stroke-dasharray='4 3'/><line x1='715.0' y1='400.0' x2='715.0' y2='340.0' stroke='#2f8f5b' stroke-width='1.5' stroke-dasharray='4 3'/><line x1='1030.0' y1='400.0' x2='1030.0' y2='340.0' stroke='#2f8f5b' stroke-width='1.5' stroke-dasharray='4 3'/><line x1='435.0' y1='340.0' x2='1030.0' y2='340.0' stroke='#2f8f5b' stroke-width='1.5' stroke-dasharray='4 3'/><rect x='320' y='560' width='510' height='80' rx='8' fill='#fff' stroke='#2f8f5b' stroke-width='1.5'/><text x='575.0' y='580.0' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' fill='#1f2328' text-anchor='middle' font-weight='600'>Compute &amp; sensors</text><text x='575.0' y='598.0' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='10.5' fill='#59636e' text-anchor='middle' font-weight='400'>Jetson T5000 + J601 (24 V) · UP Squared Pro (12 V) · ZED X Mini, 2× ZED X One, Gemini 335Lg (GMSL PoC)</text><text x='575.0' y='613.0' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='10.5' fill='#59636e' text-anchor='middle' font-weight='400'>Mid-360 (24 V) · IMUs · audio · ToF</text><line x1='435.0' y1='490.0' x2='435.0' y2='560.0' stroke='#2f8f5b' stroke-width='2' marker-end='url(#arrow)'/><line x1='715.0' y1='490.0' x2='715.0' y2='560.0' stroke='#2f8f5b' stroke-width='2' marker-end='url(#arrow)'/><rect x='880' y='560' width='300' height='80' rx='8' fill='#fff7ef' stroke='#d9822b' stroke-width='1.5'/><text x='1030.0' y='580.0' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' fill='#1f2328' text-anchor='middle' font-weight='600'>Charge port</text><text x='1030.0' y='598.0' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='10.5' fill='#59636e' text-anchor='middle' font-weight='400'>67.2 V 10 A CC/CV charger</text><text x='1030.0' y='613.0' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='10.5' fill='#59636e' text-anchor='middle' font-weight='400'>enabled by BMS over CAN</text><text x='30.0' y='700.0' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='12' fill='#59636e' text-anchor='start' font-weight='400'>Safety: e-stop chain removes SSD enable and asserts STO on all drives (Cat 0/1). BMS opens SSD on cell OV/UV/OT/OC. Peak bus ≈ 2.7 kW / 53 A; normal ≈ 0.39 kW.</text><text x='30.0' y='722.0' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='12' fill='#59636e' text-anchor='start' font-weight='400'>Wire: pack→PDU 8 AWG silicone; zone feeds 12 AWG (legs) / 14 AWG (arms); drive drops 16 AWG; all ≥ 200 °C silicone, tinned fine strand.</text></svg>
