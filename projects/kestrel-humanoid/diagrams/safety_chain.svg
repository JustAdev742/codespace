636e' text-anchor='middle' font-weight='400'>torque removed in &lt; 10 ms</text><text x='825.0' y='133.0' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='10.5' fill='#59636e' text-anchor='middle' font-weight='400'>(drives' SIL3 STO inputs)</text><rect x='700' y='220' width='250' height='90' rx='8' fill='#fff2f1' stroke='#c93c37' stroke-width='1.5'/><text x='825.0' y='240.0' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' fill='#1f2328' text-anchor='middle' font-weight='600'>Delayed bus disconnect</text><text x='825.0' y='258.0' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='10.5' fill='#59636e' text-anchor='middle' font-weight='400'>SSD opens after 0.5–1.5 s</text><text x='825.0' y='273.0' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='10.5' fill='#59636e' text-anchor='middle' font-weight='400'>(Cat 1: brake/crouch first)</text><rect x='700' y='360' width='250' height='90' rx='8' fill='#fff2f1' stroke='#c93c37' stroke-width='1.5'/><text x='825.0' y='380.0' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' fill='#1f2328' text-anchor='middle' font-weight='600'>Gantry catch</text><text x='825.0' y='398.0' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='10.5' fill='#59636e' text-anchor='middle' font-weight='400'>harness takes the load</text><text x='825.0' y='413.0' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='10.5' fill='#59636e' text-anchor='middle' font-weight='400'>(mandatory in testing)</text><line x1='610.0' y1='255.0' x2='700.0' y2='125.0' stroke='#c93c37' stroke-width='2' marker-end='url(#arrow)'/><line x1='610.0' y1='255.0' x2='700.0' y2='265.0' stroke='#c93c37' stroke-width='2' marker-end='url(#arrow)'/><line x1='610.0' y1='255.0' x2='700.0' y2='405.0' stroke='#c93c37' stroke-width='2' marker-end='url(#arrow)'/><rect x='380' y='420' width='230' height='150' rx='8' fill='#f6f1ff' stroke='#7a4fc9' stroke-width='1.5'/><text x='495.0' y='440.0' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' fill='#1f2328' text-anchor='middle' font-weight='600'>Safety MCU (TMS570)</text><text x='495.0' y='458.0' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='10.5' fill='#59636e' text-anchor='middle' font-weight='400'>monitors: tilt &gt; 35°, joint limits,</text><text x='495.0' y='473.0' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='10.5' fill='#59636e' text-anchor='middle' font-weight='400'>winding T &gt; 130 °C, bus V/I,</text><text x='495.0' y='488.0' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='10.5' fill='#59636e' text-anchor='middle' font-weight='400'>RT-controller heartbeat (2 ms),</text><text x='495.0' y='503.0' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='10.5' fill='#59636e' text-anchor='middle' font-weight='400'>comms loss &gt; 50 ms</text><text x='495.0' y='518.0' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='10.5' fill='#59636e' text-anchor='middle' font-weight='400'>→ opens relay chain</text><line x1='495.0' y1='420.0' x2='495.0' y2='310.0' stroke='#7a4fc9' stroke-width='2' marker-end='url(#arrow)'/><rect x='1000' y='80' width='210' height='90' rx='8' fill='#fff7ef' stroke='#d9822b' stroke-width='1.5'/><text x='1105.0' y='100.0' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' fill='#1f2328' text-anchor='middle' font-weight='600'>BMS</text><text x='1105.0' y='118.0' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='10.5' fill='#59636e' text-anchor='middle' font-weight='400'>cell OV/UV/OT/OC</text><text x='1105.0' y='133.0' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='10.5' fill='#59636e' text-anchor='middle' font-weight='400'>opens SSD directly</text><line x1='1000.0' y1='125.0' x2='950.0' y2='265.0' stroke='#d9822b' stroke-width='2' marker-end='url(#arrow)'/><rect x='1000' y='360' width='210' height='120' rx='8' fill='#f6f8fa' stroke='#8c959f' stroke-width='1.5'/><text x='1105.0' y='380.0' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='13' fill='#1f2328' text-anchor='middle' font-weight='600'>Software stops</text><text x='1105.0' y='398.0' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='10.5' fill='#59636e' text-anchor='middle' font-weight='400'>Cat 2 controlled stop</text><text x='1105.0' y='413.0' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='10.5' fill='#59636e' text-anchor='middle' font-weight='400'>(RT controller): crouch,</text><text x='1105.0' y='428.0' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='10.5' fill='#59636e' text-anchor='middle' font-weight='400'>kneel, hold; AI layer can only</text><text x='1105.0' y='443.0' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='10.5' fill='#59636e' text-anchor='middle' font-weight='400'>REQUEST motion</text><text x='30.0' y='620.0' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='12' fill='#59636e' text-anchor='start' font-weight='400'>Stop categories (IEC 60204-1): Cat 0 = STO + disconnect now (falls into the gantry harness during testing); Cat 1 = controlled crouch ≤ 1.5 s then STO; Cat 2 = controlled stop, power kept.</text><text x='30.0' y='642.0' font-family='Inter, Segoe UI, Helvetica, Arial, sans-serif' font-size='12' fill='#59636e' text-anchor='start' font-weight='400'>Nothing in the AI / LLM layer can bypass or delay the chain: it is hard-wired, normally-closed, and the safety MCU and BMS each have independent authority to open it.</text></svg>
